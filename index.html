<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Sphereomaniac</title>
    <link rel="stylesheet" href="sphereo.css" type="text/css">
</head>

<body>

<div id="container">
<canvas id="canvas" width="1024" height="768"></canvas>

<div id="panel-left">
    <div class="control">
        <span class="label">rotateX</span>
        <input type="number" id="proXdisp" value="0.28" min="0" max="2" step="0.01"
            oninput="proX = parseFloat(value); document.getElementById('proX').value = proX;">
        <input type="range" id="proX" value="0.28" min="0" max="2" step="0.01"
            oninput="proX = parseFloat(value); document.getElementById('proXdisp').value = proX;">
    </div>
    <div class="control">
        <span class="label">rotateY</span>
        <input type="number" id="proYdisp" value="0" min="0" max="2" step="0.01"
            oninput="proY = parseFloat(value); document.getElementById('proY').value = proY;">
        <input type="range" id="proY" value="0" min="0" max="2" step="0.01"
            oninput="proY = parseFloat(value); document.getElementById('proYdisp').value = proY;">
    </div>
    <div class="control">
        <span class="label">rotateZ</span>
        <input type="number" id="proZdisp" value="-0.33" min="-1" max="1" step="0.01"
            oninput="proZ = parseFloat(value); document.getElementById('proZ').value = proZ;">
        <input type="range" id="proZ" value="-0.33" min="-1" max="1" step="0.01"
            oninput="proZ = parseFloat(value); document.getElementById('proZdisp').value = proZ;">
    </div>
    <div class="control">
        <span class="label">offset</span>
        <input type="range" id="offset" value="2.5" min="-4" max="4" step="0.05"
            oninput="offset = parseFloat(value);">
    </div>
</div>

<div id="panel-right">
    <div class="control">
        <span class="label">loops</span>
        <input type="range" id="loops" value="60" min="1" max="100" step="1"
            oninput="loops = parseFloat(value);">
    </div>
    <div class="control">
        <span class="label">line width</span>
        <input type="range" id="lineWidth" value="3" min="1" max="20" step="1"
            oninput="lineWidth = parseInt(value);">
    </div>
    <div class="control">
        <span class="label">scale</span>
        <input type="range" id="scale" value="60" min="10" max="150" step="1"
            oninput="scale = parseFloat(value);">
    </div>
    <div class="control">
        <span class="label">animate</span>
        <input type="range" id="speedOff" value="0" min="0" max="0.05" step="0.001"
            oninput="speedOff = parseFloat(value);">
    </div>
</div>

<div id="panel-bottom">
    <button onclick="pause()">pause</button>
    <button onclick="randomize()">randomize</button>
    <label>
        <input type="checkbox" id="inColor" checked onclick="colorMgr.flip();">
        color
    </label>
    <span class="credit">by <a href="https://github.com/marksilverman/spheromaniac">Mark Silverman</a></span>
</div>
</div>

<script src="gl-matrix-min.js"></script>
<script src="sphereo.js"></script>

</body>
</html>
