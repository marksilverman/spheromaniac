<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Spheromaniac</title>
    <link rel="stylesheet" href="sphereo.css" type="text/css">
</head>

<body>
<div id="container">
<div id="title">Spheromaniac</div>
<canvas id="canvas" width="1024" height="768"></canvas>

<div id="panel-x" class="axis-panel">
    <div class="drag-handle">⠿</div>
    <div class="axis-panel-header">X-axis</div>
    <div class="axis-panel-body">
        <div class="axis-controls">
            <div class="control btn-row">
                <span class="axis-label">radius1:</span>
                <button onclick="adjustXRadius1(-1)">◀</button>
                <input type="number" id="x_radius1" value="0" oninput="setXRadius1()">
                <button onclick="adjustXRadius1(1)">▶</button>
            </div>
            <div class="control btn-row">
                <span class="axis-label">radius2:</span>
                <button onclick="adjustXRadius2(-1)">◀</button>
                <input type="number" id="x_radius2" value="0" oninput="setXRadius2()">
                <button onclick="adjustXRadius2(1)">▶</button>
            </div>
            <div class="control btn-row">
                <span class="axis-label">distance:</span>
                <button onclick="adjustXDistance(-1)">◀</button>
                <input type="number" id="x_distance" value="0" oninput="setXDistance()">
                <button onclick="adjustXDistance(1)">▶</button>
            </div>
            <div class="control">
                <input type="range" id="x_distance_slider" value=0 min=0 max=20 step=0.01
                    oninput="setXDistanceFromSlider()">
            </div>
        </div>
        <canvas class="plane-preview" id="preview_x" width="100" height="100"></canvas>
    </div>
</div>

<div id="panel-y" class="axis-panel">
    <div class="drag-handle">⠿</div>
    <div class="axis-panel-header">Y-axis</div>
    <div class="axis-panel-body">
        <div class="axis-controls">
            <div class="control btn-row">
                <span class="axis-label">radius1:</span>
                <button onclick="adjustYRadius1(-1)">◀</button>
                <input type="number" id="y_radius1" value="2" oninput="setYRadius1()">
                <button onclick="adjustYRadius1(1)">▶</button>
            </div>
            <div class="control btn-row">
                <span class="axis-label">radius2:</span>
                <button onclick="adjustYRadius2(-1)">◀</button>
                <input type="number" id="y_radius2" value="1" oninput="setYRadius2()">
                <button onclick="adjustYRadius2(1)">▶</button>
            </div>
            <div class="control btn-row">
                <span class="axis-label">distance:</span>
                <button onclick="adjustYDistance(-1)">◀</button>
                <input type="number" id="y_distance" value="2" oninput="setYDistance()">
                <button onclick="adjustYDistance(1)">▶</button>
            </div>
            <div class="control">
                <input type="range" id="y_distance_slider" value=2 min=0 max=20 step=0.01
                    oninput="setYDistanceFromSlider()">
            </div>
        </div>
        <canvas class="plane-preview" id="preview_y" width="100" height="100"></canvas>
    </div>
</div>

<div id="panel-z" class="axis-panel">
    <div class="drag-handle">⠿</div>
    <div class="axis-panel-header">Z-axis</div>
    <div class="axis-panel-body">
        <div class="axis-controls">
            <div class="control btn-row">
                <span class="axis-label">radius1:</span>
                <button onclick="adjustZRadius1(-1)">◀</button>
                <input type="number" id="z_radius1" value="8" oninput="setZRadius1()">
                <button onclick="adjustZRadius1(1)">▶</button>
            </div>
            <div class="control btn-row">
                <span class="axis-label">radius2:</span>
                <button onclick="adjustZRadius2(-1)">◀</button>
                <input type="number" id="z_radius2" value="3" oninput="setZRadius2()">
                <button onclick="adjustZRadius2(1)">▶</button>
            </div>
            <div class="control btn-row">
                <span class="axis-label">distance:</span>
                <button onclick="adjustZDistance(-1)">◀</button>
                <input type="number" id="z_distance" value="7" oninput="setZDistance()">
                <button onclick="adjustZDistance(1)">▶</button>
            </div>
            <div class="control">
                <input type="range" id="z_distance_slider" value=7 min=0 max=20 step=0.01
                    oninput="setZDistanceFromSlider()">
            </div>
        </div>
        <canvas class="plane-preview" id="preview_z" width="100" height="100"></canvas>
    </div>
</div>

<div id="panel-right">
    <div class="drag-handle">⠿</div>
    <div class="control btn-row">
        <span class="label">loops</span>
        <input type="text" id="loops_num" value="10"
            oninput="setLoops(this.value)">
    </div>
    <div class="control">
        <input type="range" id="loops" value=10 min=1 max=60 step=1
            oninput="setLoops(this.value)">
    </div>
    <div class="control">
        <span class="label">line width</span>
        <input type="range" id="lineWidth" value=3 min=1 max=20 step=1
            oninput="lineWidth = parseInt(this.value);">
    </div>
    <div class="control">
        <span class="label">scale</span>
        <input type="range" id="scale" value=200 min=10 max=400 step=1
            oninput="scale = parseFloat(this.value);">
    </div>
</div>


<div id="panel-bottom-right">
    <div class="drag-handle">⠿</div>
    <button onclick="resetCamera()">[r]eset camera</button>
    <button onclick="toggleAllAutoRotate()">auto-rotate</button>
    <div class="control btn-row">
        <button onclick="setCameraPlaneXY()">XY</button>
        <button onclick="setCameraPlaneXZ()">XZ</button>
        <button onclick="setCameraPlaneYZ()">YZ</button>
    </div>
    <div class="camera-label-row">
        <span class="label">cameraX (w/s)</span>
        <label><input type="checkbox" id="autoRotateX" checked onclick="autoRotateX = this.checked;"> auto</label>
    </div>
    <div class="control camera-row">
        <button class="jump-btn" onclick="setCameraX(cameraRotationX - Math.PI/2)">«</button>
        <button onclick="setCameraX(cameraRotationX - keyboardStep)">◀</button>
        <input type="range" id="cameraRotationX" value=0 min=0 max=6.28 step=0.001
            oninput="setCameraX(this.value)">
        <button onclick="setCameraX(cameraRotationX + keyboardStep)">▶</button>
        <button class="jump-btn" onclick="setCameraX(cameraRotationX + Math.PI/2)">»</button>
    </div>
    <div class="camera-label-row">
        <span class="label">cameraY (a/d)</span>
        <label><input type="checkbox" id="autoRotateY" checked onclick="autoRotateY = this.checked;"> auto</label>
    </div>
    <div class="control camera-row">
        <button class="jump-btn" onclick="setCameraY(cameraRotationY - Math.PI/2)">«</button>
        <button onclick="setCameraY(cameraRotationY - keyboardStep)">◀</button>
        <input type="range" id="cameraRotationY" value=0 min=0 max=6.28 step=0.001
            oninput="setCameraY(this.value)">
        <button onclick="setCameraY(cameraRotationY + keyboardStep)">▶</button>
        <button class="jump-btn" onclick="setCameraY(cameraRotationY + Math.PI/2)">»</button>
    </div>
    <div class="camera-label-row">
        <span class="label">cameraZ (q/e)</span>
        <label><input type="checkbox" id="autoRotateZ" checked onclick="autoRotateZ = this.checked;"> auto</label>
    </div>
    <div class="control camera-row">
        <button class="jump-btn" onclick="setCameraZ(cameraRotationZ - Math.PI/2)">«</button>
        <button onclick="setCameraZ(cameraRotationZ - keyboardStep)">◀</button>
        <input type="range" id="cameraRotationZ" value=0 min=0 max=6.28 step=0.001
            oninput="setCameraZ(this.value)">
        <button onclick="setCameraZ(cameraRotationZ + keyboardStep)">▶</button>
        <button class="jump-btn" onclick="setCameraZ(cameraRotationZ + Math.PI/2)">»</button>
    </div>
</div>

<div id="panel-bottom">
    <div class="drag-handle">⠿</div>
    <div class="panel-row">
        <button onclick="randomize()">randomize</button>
        <label>
            <input type="checkbox" id="inColor" onclick="colorMgr.flip();">
            cycle color
        </label>
        <label>
            <input type="checkbox" id="lightMode" onclick="toggleLight();">
            light mode
        </label>
        <label>
            <input type="checkbox" id="animateDrawing" onclick="toggleAnimate();">
            animate
        </label>
        <label>
            <input type="checkbox" id="showAxes" onclick="showAxes = this.checked;">
            axes
        </label>
        <input type="color" id="colorPicker" value="#00ffff" oninput="customColor = this.value;">
        <span class="credit">by <a href="https://github.com/marksilverman/spheromaniac">Mark Silverman</a></span>
    </div>
</div>
</div>

<div id="panel-axes">
    <div class="drag-handle">⠿</div>
    <canvas id="axes-indicator" width="160" height="160"></canvas>
</div>

<script src="gl-matrix-min.js"></script>
<script src="sphereo.js"></script>

</body>
</html>
