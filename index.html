<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Spheromaniac</title>
    <link rel="stylesheet" href="sphereo.css" type="text/css">
</head>

<body>
<div id="container">
<div id="title">Spheromaniac</div>
<canvas id="canvas" width="1024" height="768"></canvas>

<div id="panel-left">
    <div class="drag-handle">⠿</div>
    <div class="axis-panel">
        <div class="axis-panel-header">X-axis</div>
        <div class="control btn-row">
            <span class="axis-label">turns:</span>
            <button onclick="adjustX(-1)">◀</button>
            <input type="number" id="x_turns" value="0" oninput="setXTurns()">
            <button onclick="adjustX(1)">▶</button>
        </div>
        <div class="control btn-row">
            <span class="axis-label">period:</span>
            <button onclick="adjustXPeriod(-1)">◀</button>
            <input type="number" id="x_period" value="1" min="1" oninput="setXPeriod()">
            <button onclick="adjustXPeriod(1)">▶</button>
        </div>
    </div>
    <div class="axis-panel">
        <div class="axis-panel-header">Y-axis</div>
        <div class="control btn-row">
            <span class="axis-label">turns:</span>
            <button onclick="adjustY(-1)">◀</button>
            <input type="number" id="y_turns" value="0" oninput="setYTurns()">
            <button onclick="adjustY(1)">▶</button>
        </div>
        <div class="control btn-row">
            <span class="axis-label">period:</span>
            <button onclick="adjustYPeriod(-1)">◀</button>
            <input type="number" id="y_period" value="1" min="1" oninput="setYPeriod()">
            <button onclick="adjustYPeriod(1)">▶</button>
        </div>
    </div>
    <div class="axis-panel">
        <div class="axis-panel-header">Z-axis</div>
        <div class="control btn-row">
            <span class="axis-label">turns:</span>
            <button onclick="adjustZ(-1)">◀</button>
            <input type="number" id="z_turns" value="0" oninput="setZTurns()">
            <button onclick="adjustZ(1)">▶</button>
        </div>
        <div class="control btn-row">
            <span class="axis-label">period:</span>
            <button onclick="adjustZPeriod(-1)">◀</button>
            <input type="number" id="z_period" value="1" min="1" oninput="setZPeriod()">
            <button onclick="adjustZPeriod(1)">▶</button>
        </div>
    </div>
</div>

<div id="panel-right">
    <div class="drag-handle">⠿</div>
    <div class="control btn-row">
        <span class="label">loops</span>
        <input type="text" id="loops_num" value="10"
            oninput="setLoops(this.value)">
    </div>
    <div class="control">
        <input type="range" id="loops" value=10 min=1 max=60 step=1
            oninput="setLoops(this.value)">
    </div>
    <div class="control">
        <span class="label">line width</span>
        <input type="range" id="lineWidth" value=3 min=1 max=20 step=1
            oninput="lineWidth = parseInt(this.value);">
    </div>
    <div class="control">
        <span class="label">scale</span>
        <input type="range" id="scale" value=200 min=10 max=400 step=1
            oninput="scale = parseFloat(this.value);">
    </div>
    <div class="control">
        <span class="label">offset</span>
        <input type="range" id="offset" value=0.1 min=-4.0 max=4.0 step=0.01
            oninput="offset = parseFloat(this.value);">
    </div>
    <div class="control">
        <span class="label">animate offset</span>
        <input type="range" id="speedOff" value=0 min=0 max=0.05 step=0.001
            oninput="speedOff = parseFloat(this.value);">
    </div>
</div>

<div id="panel-bottom-right">
    <div class="drag-handle">⠿</div>
    <button onclick="resetCamera()">[r]eset camera</button>
    <div class="control">
        <label>
            <input type="checkbox" id="autoRotate" checked onclick="autoRotate = this.checked;">
            auto-rotate
        </label>
    </div>
    <div class="control">
        <span class="label">cameraX (w/s)</span>
    </div>
    <div class="control camera-row">
        <button class="jump-btn" onclick="setCameraX(cameraRotationX - Math.PI/2)">«</button>
        <button onclick="setCameraX(cameraRotationX - keyboardStep)">◀</button>
        <input type="range" id="cameraRotationX" value=0 min=0 max=6.28 step=0.001
            oninput="setCameraX(this.value)">
        <button onclick="setCameraX(cameraRotationX + keyboardStep)">▶</button>
        <button class="jump-btn" onclick="setCameraX(cameraRotationX + Math.PI/2)">»</button>
    </div>
    <div class="control">
        <span class="label">cameraY (a/d)</span>
    </div>
    <div class="control camera-row">
        <button class="jump-btn" onclick="setCameraY(cameraRotationY - Math.PI/2)">«</button>
        <button onclick="setCameraY(cameraRotationY - keyboardStep)">◀</button>
        <input type="range" id="cameraRotationY" value=0 min=0 max=6.28 step=0.001
            oninput="setCameraY(this.value)">
        <button onclick="setCameraY(cameraRotationY + keyboardStep)">▶</button>
        <button class="jump-btn" onclick="setCameraY(cameraRotationY + Math.PI/2)">»</button>
    </div>
    <div class="control">
        <span class="label">cameraZ (q/e)</span>
    </div>
    <div class="control camera-row">
        <button class="jump-btn" onclick="setCameraZ(cameraRotationZ - Math.PI/2)">«</button>
        <button onclick="setCameraZ(cameraRotationZ - keyboardStep)">◀</button>
        <input type="range" id="cameraRotationZ" value=0 min=0 max=6.28 step=0.001
            oninput="setCameraZ(this.value)">
        <button onclick="setCameraZ(cameraRotationZ + keyboardStep)">▶</button>
        <button class="jump-btn" onclick="setCameraZ(cameraRotationZ + Math.PI/2)">»</button>
    </div>
</div>

<div id="panel-bottom">
    <div class="drag-handle">⠿</div>
    <div class="panel-row">
        <button onclick="randomize()">randomize</button>
        <label>
            <input type="checkbox" id="inColor" onclick="colorMgr.flip();">
            cycle color
        </label>
        <label>
            <input type="checkbox" id="lightMode" onclick="toggleLight();">
            light mode
        </label>
        <input type="color" id="colorPicker" value="#00ffff" oninput="customColor = this.value;">
        <span class="credit">by <a href="https://github.com/marksilverman/spheromaniac">Mark Silverman</a></span>
    </div>
</div>
</div>

<script src="gl-matrix-min.js"></script>
<script src="sphereo.js"></script>

</body>
</html>
