<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Spheromaniac</title>
    <link rel="stylesheet" href="sphereo.css" type="text/css">
</head>

<body>
<div id="container">
<div id="panel-title" class="panel">
    <div class="drag-handle">⠿</div>
    <div id="title">Spheromaniac</div>
    <div class="credit">by <a href="https://github.com/marksilverman/spheromaniac">Mark Silverman</a></div>
</div>
<canvas id="canvas" width="1024" height="768"></canvas>

<div id="panel-x" class="axis-panel panel">
    <div class="drag-handle">⠿</div>
    <div class="axis-panel-header">X rotation</div>
    <div class="control btn-row">
        <span class="axis-label">turns:</span>
        <button onclick="app.adjust(app.xTurnsInput, -1)">◀</button>
        <input type="number" id="x_turns" value="4" oninput="app.readAllParams()">
        <button onclick="app.adjust(app.xTurnsInput, 1)">▶</button>
    </div>
    <div class="control">
        <input type="range" id="x_turns_slider" value=4 min=0 max=30 step=0.01
            oninput="app.xTurnsInput.value = this.value; app.readAllParams()">
    </div>
    <div class="control btn-row">
        <span class="axis-label">period:</span>
        <button onclick="app.adjust(app.xPeriodInput, -1)">◀</button>
        <input type="number" id="x_period" value="5" oninput="app.readAllParams()">
        <button onclick="app.adjust(app.xPeriodInput, 1)">▶</button>
    </div>
    <div class="control">
        <input type="range" id="x_period_slider" value=5 min=0 max=20 step=0.01
            oninput="app.xPeriodInput.value = this.value; app.readAllParams()">
    </div>
</div>

<div id="panel-y" class="axis-panel panel">
    <div class="drag-handle">⠿</div>
    <div class="axis-panel-header">Y rotation</div>
    <div class="control btn-row">
        <span class="axis-label">turns:</span>
        <button onclick="app.adjust(app.yTurnsInput, -1)">◀</button>
        <input type="number" id="y_turns" value="0" oninput="app.readAllParams()">
        <button onclick="app.adjust(app.yTurnsInput, 1)">▶</button>
    </div>
    <div class="control">
        <input type="range" id="y_turns_slider" value=0 min=0 max=30 step=0.01
            oninput="app.yTurnsInput.value = this.value; app.readAllParams()">
    </div>
    <div class="control btn-row">
        <span class="axis-label">period:</span>
        <button onclick="app.adjust(app.yPeriodInput, -1)">◀</button>
        <input type="number" id="y_period" value="1" oninput="app.readAllParams()">
        <button onclick="app.adjust(app.yPeriodInput, 1)">▶</button>
    </div>
    <div class="control">
        <input type="range" id="y_period_slider" value=1 min=0 max=20 step=0.01
            oninput="app.yPeriodInput.value = this.value; app.readAllParams()">
    </div>
</div>

<div id="panel-shape" class="axis-panel panel">
    <div class="drag-handle">⠿</div>
    <div class="axis-panel-header">spirograph</div>
    <div class="axis-panel-body">
        <div class="axis-controls">
            <div class="control btn-row">
                <span class="axis-label">radius1:</span>
                <button onclick="app.adjust(app.fixedCircleRadiusInput, -1)">◀</button>
                <input type="number" id="fixed_circle_radius" value="8" oninput="app.readAllParams()">
                <button onclick="app.adjust(app.fixedCircleRadiusInput, 1)">▶</button>
            </div>
            <div class="control btn-row">
                <span class="axis-label">radius2:</span>
                <button onclick="app.adjust(app.rollingCircleRadiusInput, -1)">◀</button>
                <input type="number" id="rolling_circle_radius" value="6" oninput="app.readAllParams()">
                <button onclick="app.adjust(app.rollingCircleRadiusInput, 1)">▶</button>
            </div>
            <div class="control btn-row">
                <span class="axis-label">distance:</span>
                <button onclick="app.adjust(app.penDistanceInput, -1)">◀</button>
                <input type="number" id="pen_distance" value="12" oninput="app.readAllParams()">
                <button onclick="app.adjust(app.penDistanceInput, 1)">▶</button>
            </div>
            <div class="control">
                <input type="range" id="pen_distance_slider" value=12 min=0 max=20 step=0.01
                    oninput="app.penDistanceInput.value = this.value; app.readAllParams()">
            </div>
        </div>
    </div>
</div>

<div id="panel-preview" class="panel">
    <div class="drag-handle">⠿</div>
    <canvas class="plane-preview" id="preview_shape" width="100" height="100"></canvas>
</div>

<div id="panel-bottom-right" class="panel">
    <div class="drag-handle">⠿</div>
    <button onclick="app.resetCamera()">[r]eset camera</button>
    <button onclick="app.toggleAllAutoRotate()">auto-rotate</button>
    <div class="control btn-row">
        <button onclick="app.setCameraPlane(0, 0, 0)">XY</button>
        <button onclick="app.setCameraPlane(3*Math.PI/2, 0, 0)">XZ</button>
        <button onclick="app.setCameraPlane(0, Math.PI/2, 0)">YZ</button>
    </div>
    <div class="camera-label-row">
        <span class="label">cameraX (w/s)</span>
        <label><input type="checkbox" id="autoRotateX" checked onclick="app.autoRotateX = this.checked;"> auto</label>
    </div>
    <div class="control camera-row">
        <button class="jump-btn" onclick="app.setCameraX(app.cameraRotationX - Math.PI/2)">«</button>
        <button onclick="app.setCameraX(app.cameraRotationX - app.keyboardStep)">◀</button>
        <input type="range" id="cameraRotationX" value=0 min=0 max=6.28 step=0.001
            oninput="app.setCameraX(this.value)">
        <button onclick="app.setCameraX(app.cameraRotationX + app.keyboardStep)">▶</button>
        <button class="jump-btn" onclick="app.setCameraX(app.cameraRotationX + Math.PI/2)">»</button>
    </div>
    <div class="camera-label-row">
        <span class="label">cameraY (a/d)</span>
        <label><input type="checkbox" id="autoRotateY" checked onclick="app.autoRotateY = this.checked;"> auto</label>
    </div>
    <div class="control camera-row">
        <button class="jump-btn" onclick="app.setCameraY(app.cameraRotationY - Math.PI/2)">«</button>
        <button onclick="app.setCameraY(app.cameraRotationY - app.keyboardStep)">◀</button>
        <input type="range" id="cameraRotationY" value=0 min=0 max=6.28 step=0.001
            oninput="app.setCameraY(this.value)">
        <button onclick="app.setCameraY(app.cameraRotationY + app.keyboardStep)">▶</button>
        <button class="jump-btn" onclick="app.setCameraY(app.cameraRotationY + Math.PI/2)">»</button>
    </div>
    <div class="camera-label-row">
        <span class="label">cameraZ (q/e)</span>
        <label><input type="checkbox" id="autoRotateZ" checked onclick="app.autoRotateZ = this.checked;"> auto</label>
    </div>
    <div class="control camera-row">
        <button class="jump-btn" onclick="app.setCameraZ(app.cameraRotationZ - Math.PI/2)">«</button>
        <button onclick="app.setCameraZ(app.cameraRotationZ - app.keyboardStep)">◀</button>
        <input type="range" id="cameraRotationZ" value=0 min=0 max=6.28 step=0.001
            oninput="app.setCameraZ(this.value)">
        <button onclick="app.setCameraZ(app.cameraRotationZ + app.keyboardStep)">▶</button>
        <button class="jump-btn" onclick="app.setCameraZ(app.cameraRotationZ + Math.PI/2)">»</button>
    </div>
</div>

<div id="panel-right" class="panel">
    <div class="drag-handle">⠿</div>
    <div class="btn-row">
        <span class="label">loops</span>
        <input type="text" id="loops_num" value="10" oninput="app.setLoops(this.value)">
    </div>
    <input type="range" id="loops" value=10 min=1 max=60 step=1 oninput="app.setLoops(this.value)">
    <span class="label">line width</span>
    <input type="range" id="lineWidth" value=3 min=1 max=20 step=1 oninput="app.lineWidth = parseInt(this.value);">
    <span class="label">scale</span>
    <input type="range" id="scale" value=200 min=10 max=400 step=1 oninput="app.scale = parseFloat(this.value);">
    <hr class="panel-hr">
    <button onclick="app.randomize()">randomize</button>
    <button onclick="app.exportOBJ()">export OBJ</button>
    <hr class="panel-hr">
    <div class="btn-row">
        <span class="label">color: </span>
        <input type="color" id="colorPicker" value="#00ffff" oninput="app.customColor = this.value;">
    </div>
    <label><input type="checkbox" id="inColor" onclick="app.colorMgr.flip();"> cycle color</label>
    <label><input type="checkbox" id="lightMode" onclick="app.toggleLight();"> light mode</label>
    <label><input type="checkbox" id="showAxes" onclick="app.showAxes = this.checked;"> axes</label>
</div>
</div>

<div id="panel-animation" class="axis-panel panel">
    <div class="drag-handle">⠿</div>
    <div class="axis-panel-header">animation</div>
    <button id="animateBtn" onclick="app.toggleAnimate()">begin animation</button>
    <span class="label">tail</span>
    <input type="range" id="tail_loops" value=1 min=0 max=10 step=0.05 oninput="app.setTailLoops(this.value)">
    <span class="label">speed</span>
    <input type="range" id="animation_speed" value=0.05 min=0.001 max=0.3 step=0.001 oninput="app.animationSpeed = parseFloat(this.value)">
    <hr class="panel-hr">
    <label><input type="checkbox" id="showMechanism" checked onclick="app.showMechanism = this.checked;"> mechanism</label>
</div>

<div id="panel-axes" class="panel">
    <div class="drag-handle">⠿</div>
    <canvas id="axes-indicator" width="160" height="160"></canvas>
</div>

<script src="gl-matrix-min.js"></script>
<script src="sphereo.js"></script>

</body>
</html>
