<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Spheromaniac</title>
    <link rel="stylesheet" href="sphereo.css" type="text/css">
</head>

<body>
<div id="container">
<div id="panel-title" class="panel">
    <div class="drag-handle">⠿</div>
    <div id="title">Spheromaniac</div>
    <div class="credit">by <a href="https://github.com/marksilverman/spheromaniac">Mark Silverman</a></div>
</div>
<canvas id="canvas" width="1024" height="768"></canvas>

<div id="panel-x" class="axis-panel panel">
    <div class="drag-handle">⠿</div>
    <div class="axis-panel-header">X rotation</div>
    <div class="control btn-row">
        <span class="axis-label">turns:</span>
        <button onclick="adjustXTurns(-1)">◀</button>
        <input type="number" id="x_turns" value="4" oninput="setXTurns()">
        <button onclick="adjustXTurns(1)">▶</button>
    </div>
    <div class="control">
        <input type="range" id="x_turns_slider" value=4 min=0 max=30 step=0.01
            oninput="setXTurnsFromSlider()">
    </div>
    <div class="control btn-row">
        <span class="axis-label">period:</span>
        <button onclick="adjustXPeriod(-1)">◀</button>
        <input type="number" id="x_period" value="5" oninput="setXPeriod()">
        <button onclick="adjustXPeriod(1)">▶</button>
    </div>
    <div class="control">
        <input type="range" id="x_period_slider" value=5 min=0 max=20 step=0.01
            oninput="setXPeriodFromSlider()">
    </div>
</div>

<div id="panel-y" class="axis-panel panel">
    <div class="drag-handle">⠿</div>
    <div class="axis-panel-header">Y rotation</div>
    <div class="control btn-row">
        <span class="axis-label">turns:</span>
        <button onclick="adjustYTurns(-1)">◀</button>
        <input type="number" id="y_turns" value="1" oninput="setYTurns()">
        <button onclick="adjustYTurns(1)">▶</button>
    </div>
    <div class="control">
        <input type="range" id="y_turns_slider" value=1 min=0 max=30 step=0.01
            oninput="setYTurnsFromSlider()">
    </div>
    <div class="control btn-row">
        <span class="axis-label">period:</span>
        <button onclick="adjustYPeriod(-1)">◀</button>
        <input type="number" id="y_period" value="1" oninput="setYPeriod()">
        <button onclick="adjustYPeriod(1)">▶</button>
    </div>
    <div class="control">
        <input type="range" id="y_period_slider" value=1 min=0 max=20 step=0.01
            oninput="setYPeriodFromSlider()">
    </div>
</div>

<div id="panel-z" class="axis-panel panel">
    <div class="drag-handle">⠿</div>
    <div class="axis-panel-header">spirograph</div>
    <div class="axis-panel-body">
        <div class="axis-controls">
            <div class="control btn-row">
                <span class="axis-label">radius1:</span>
                <button onclick="adjustZRadius1(-1)">◀</button>
                <input type="number" id="z_radius1" value="8" oninput="setZRadius1()">
                <button onclick="adjustZRadius1(1)">▶</button>
            </div>
            <div class="control btn-row">
                <span class="axis-label">radius2:</span>
                <button onclick="adjustZRadius2(-1)">◀</button>
                <input type="number" id="z_radius2" value="6" oninput="setZRadius2()">
                <button onclick="adjustZRadius2(1)">▶</button>
            </div>
            <div class="control btn-row">
                <span class="axis-label">distance:</span>
                <button onclick="adjustZDistance(-1)">◀</button>
                <input type="number" id="z_distance" value="12" oninput="setZDistance()">
                <button onclick="adjustZDistance(1)">▶</button>
            </div>
            <div class="control">
                <input type="range" id="z_distance_slider" value=12 min=0 max=20 step=0.01
                    oninput="setZDistanceFromSlider()">
            </div>
        </div>
        <canvas class="plane-preview" id="preview_z" width="100" height="100"></canvas>
    </div>
</div>



<div id="panel-bottom-right" class="panel">
    <div class="drag-handle">⠿</div>
    <button onclick="resetCamera()">[r]eset camera</button>
    <button onclick="toggleAllAutoRotate()">auto-rotate</button>
    <div class="control btn-row">
        <button onclick="setCameraPlane(0, 0, 0)">XY</button>
        <button onclick="setCameraPlane(3*Math.PI/2, 0, 0)">XZ</button>
        <button onclick="setCameraPlane(0, Math.PI/2, 0)">YZ</button>
    </div>
    <div class="camera-label-row">
        <span class="label">cameraX (w/s)</span>
        <label><input type="checkbox" id="autoRotateX" checked onclick="autoRotateX = this.checked;"> auto</label>
    </div>
    <div class="control camera-row">
        <button class="jump-btn" onclick="setCameraX(cameraRotationX - Math.PI/2)">«</button>
        <button onclick="setCameraX(cameraRotationX - keyboardStep)">◀</button>
        <input type="range" id="cameraRotationX" value=0 min=0 max=6.28 step=0.001
            oninput="setCameraX(this.value)">
        <button onclick="setCameraX(cameraRotationX + keyboardStep)">▶</button>
        <button class="jump-btn" onclick="setCameraX(cameraRotationX + Math.PI/2)">»</button>
    </div>
    <div class="camera-label-row">
        <span class="label">cameraY (a/d)</span>
        <label><input type="checkbox" id="autoRotateY" checked onclick="autoRotateY = this.checked;"> auto</label>
    </div>
    <div class="control camera-row">
        <button class="jump-btn" onclick="setCameraY(cameraRotationY - Math.PI/2)">«</button>
        <button onclick="setCameraY(cameraRotationY - keyboardStep)">◀</button>
        <input type="range" id="cameraRotationY" value=0 min=0 max=6.28 step=0.001
            oninput="setCameraY(this.value)">
        <button onclick="setCameraY(cameraRotationY + keyboardStep)">▶</button>
        <button class="jump-btn" onclick="setCameraY(cameraRotationY + Math.PI/2)">»</button>
    </div>
    <div class="camera-label-row">
        <span class="label">cameraZ (q/e)</span>
        <label><input type="checkbox" id="autoRotateZ" checked onclick="autoRotateZ = this.checked;"> auto</label>
    </div>
    <div class="control camera-row">
        <button class="jump-btn" onclick="setCameraZ(cameraRotationZ - Math.PI/2)">«</button>
        <button onclick="setCameraZ(cameraRotationZ - keyboardStep)">◀</button>
        <input type="range" id="cameraRotationZ" value=0 min=0 max=6.28 step=0.001
            oninput="setCameraZ(this.value)">
        <button onclick="setCameraZ(cameraRotationZ + keyboardStep)">▶</button>
        <button class="jump-btn" onclick="setCameraZ(cameraRotationZ + Math.PI/2)">»</button>
    </div>
</div>

<div id="panel-right" class="panel">
    <div class="drag-handle">⠿</div>
    <div class="btn-row">
        <span class="label">loops</span>
        <input type="text" id="loops_num" value="10" oninput="setLoops(this.value)">
    </div>
    <input type="range" id="loops" value=10 min=1 max=60 step=1 oninput="setLoops(this.value)">
    <span class="label">line width</span>
    <input type="range" id="lineWidth" value=3 min=1 max=20 step=1 oninput="lineWidth = parseInt(this.value);">
    <span class="label">scale</span>
    <input type="range" id="scale" value=200 min=10 max=400 step=1 oninput="scale = parseFloat(this.value);">
    <hr class="panel-hr">
    <button onclick="randomize()">randomize</button>
    <button id="animateBtn" onclick="toggleAnimate()">animate</button>
    <button onclick="exportOBJ()">export OBJ</button>
    <hr class="panel-hr">
    <input type="color" id="colorPicker" value="#00ffff" oninput="customColor = this.value;">
    <label><input type="checkbox" id="inColor" onclick="colorMgr.flip();"> cycle color</label>
    <label><input type="checkbox" id="lightMode" onclick="toggleLight();"> light mode</label>
    <label><input type="checkbox" id="showAxes" onclick="showAxes = this.checked;"> axes</label>
</div>
</div>

<div id="panel-axes" class="panel">
    <div class="drag-handle">⠿</div>
    <canvas id="axes-indicator" width="160" height="160"></canvas>
</div>

<script src="gl-matrix-min.js"></script>
<script src="sphereo.js"></script>

</body>
</html>
