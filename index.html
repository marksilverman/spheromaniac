<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Sphereomaniac</title>
    <link rel="stylesheet" href="sphereo.css" type="text/css">
</head>

<body>
<div id="container">
<canvas id="canvas" width="1024" height="768"></canvas>

<div id="panel-left">
    <div class="control btn-row">
        <span class="label">rotateX</span>
        <input type="number" id="x_rotation_num" value=0 step=0.01
               style="width:75px;font-size:20px;padding:4px"
	       onchange="x_rotation=parseFloat(this.value);document.getElementById('x_rotation_slide').value=x_rotation">
        <input type="range" id="x_rotation_slide" value=0 min="-1" max="1" step=0.01
               style="width:400px"
	       oninput="x_rotation=parseFloat(this.value);document.getElementById('x_rotation_num').value=x_rotation">
        <button onclick="adjustX(-1)">◀</button>
        <button onclick="adjustX(-0.1)">◁</button>
        <button onclick="adjustX(0)">0</button>
        <button onclick="adjustX(0.1)">▷</button>
        <button onclick="adjustX(1)">▶</button>
    </div>
    <div class="control btn-row" style="font-size:14px">
        <button onclick="adjustX(-Math.PI)">−π</button>
        <button onclick="adjustX(-Math.PI/2)">−½π</button>
        <button onclick="adjustX(-Math.PI/3)">−⅓π</button>
        <button onclick="adjustX(-Math.PI/4)">−¼π</button>
        <button onclick="adjustX(-Math.PI/6)">−⅙π</button>
        <button onclick="adjustX(0)">0</button>
        <button onclick="adjustX(Math.PI/6)">+⅙π</button>
        <button onclick="adjustX(Math.PI/4)">+¼π</button>
        <button onclick="adjustX(Math.PI/3)">+⅓π</button>
        <button onclick="adjustX(Math.PI/2)">+½π</button>
        <button onclick="adjustX(Math.PI)">+π</button>
    </div>
    <div class="control btn-row">
        <span class="label">rotateY</span>
        <input type="number" id="y_rotation_num" value=0 step=0.01
            style="width:75px;font-size:20px;padding:4px" onchange="y_rotation=parseFloat(this.value);document.getElementById('y_rotation_slide').value=y_rotation">
        <input type="range" id="y_rotation_slide" value=0 min="-1" max="1" step=0.01
            style="width:400px" oninput="y_rotation=parseFloat(this.value);document.getElementById('y_rotation_num').value=y_rotation">
        <button onclick="adjustY(-1)">◀</button>
        <button onclick="adjustY(-0.1)">◁</button>
        <button onclick="adjustY(0)">0</button>
        <button onclick="adjustY(0.1)">▷</button>
        <button onclick="adjustY(1)">▶</button>
    </div>
<div class="control btn-row" style="font-size:14px">
        <button onclick="adjustY(-Math.PI)">−π</button>
        <button onclick="adjustY(-Math.PI/2)">−½π</button>
        <button onclick="adjustY(-Math.PI/3)">−⅓π</button>
        <button onclick="adjustY(-Math.PI/4)">−¼π</button>
        <button onclick="adjustY(-Math.PI/6)">−⅙π</button>
        <button onclick="adjustY(0)">0</button>
        <button onclick="adjustY(Math.PI/6)">+⅙π</button>
        <button onclick="adjustY(Math.PI/4)">+¼π</button>
        <button onclick="adjustY(Math.PI/3)">+⅓π</button>
        <button onclick="adjustY(Math.PI/2)">+½π</button>
        <button onclick="adjustY(Math.PI)">+π</button>
    </div>
    <div class="control btn-row">
        <span class="label">rotateZ</span>
        <input type="number" id="z_rotation_num" value=0 step=0.01
               style="width:75px;font-size:20px;padding:4px"
	       onchange="z_rotation=parseFloat(this.value);document.getElementById('z_rotation_slide').value=z_rotation">
        <input type="range" id="z_rotation_slide" value=0 min="-1" max="1" step=0.01
               style="width:400px"
	       oninput="z_rotation=parseFloat(this.value);document.getElementById('z_rotation_num').value=z_rotation">
        <button onclick="adjustZ(-1)">◀</button>
        <button onclick="adjustZ(-0.1)">◁</button>
        <button onclick="adjustZ(0)">0</button>
        <button onclick="adjustZ(0.1)">▷</button>
        <button onclick="adjustZ(1)">▶</button>
    </div>
    <div class="control btn-row" style="font-size:14px">
        <button onclick="adjustZ(-Math.PI)">−π</button>
        <button onclick="adjustZ(-Math.PI/2)">−½π</button>
        <button onclick="adjustZ(-Math.PI/3)">−⅓π</button>
        <button onclick="adjustZ(-Math.PI/4)">−¼π</button>
        <button onclick="adjustZ(-Math.PI/6)">−⅙π</button>
        <button onclick="adjustZ(0)">0</button>
        <button onclick="adjustZ(Math.PI/6)">+⅙π</button>
        <button onclick="adjustZ(Math.PI/4)">+¼π</button>
        <button onclick="adjustZ(Math.PI/3)">+⅓π</button>
        <button onclick="adjustZ(Math.PI/2)">+½π</button>
        <button onclick="adjustZ(Math.PI)">+π</button>
    </div>
    <div class="control">
        <span class="label">offset</span>
        <input type="range" id="offset" value=0.1 min=-2.0 max=2.0 step=0.01
            oninput="offset = parseFloat(value);">
    </div>
</div>

<div id="panel-right">
    <div class="control">
        <span class="label">loops</span>
        <input type="range" id="loops" value=10 min=1 max=200 step=1
            oninput="loops = parseFloat(value);">
    </div>
    <div class="control">
        <span class="label">line width</span>
        <input type="range" id="lineWidth" value=3 min=1 max=20 step=1
            oninput="lineWidth = parseInt(value);">
    </div>
    <div class="control">
        <span class="label">scale</span>
        <input type="range" id="scale" value=200 min=10 max=400 step=1 oninput="scale = parseFloat(value);">
    </div>
    <div class="control">
        <span class="label">animate</span>
        <input type="range" id="speedOff" value=0 min=0 max=0.05 step=0.001
            oninput="speedOff = parseFloat(value);">
    </div>
</div>

<div id="panel-bottom">
    <button onclick="pause()">pause</button>
    <button onclick="randomize()">randomize</button>
    <label>
        <input type="checkbox" id="inColor" checked onclick="colorMgr.flip();">
        color
    </label>
    <span class="credit">by <a href="https://github.com/marksilverman/spheromaniac">Mark Silverman</a></span>
</div>
</div>

<script src="gl-matrix-min.js"></script>
<script src="sphereo.js"></script>

</body>
</html>
