<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Sphereomaniac</title>
    <link rel="stylesheet" href="sphereo.css" type="text/css">
</head>

<body>
<div id="container">
<canvas id="canvas" width="1024" height="768"></canvas>

<div id="panel-left">
    <div class="control btn-row">
        <span class="label">rotateX</span>
        <input type="text" id="x_rotation_num" value="0"
               style="width:100px;font-size:20px;padding:4px"
	       onchange="x_rotation=safeEval(this.value); updateDisplay()">
    </div>
    <div class="control">
        <input type="range" id="x_rotation_slide" value=0 min="0" max="1" step=0.000001
               style="width:400px"
	       oninput="x_rotation=parseFloat(this.value);document.getElementById('x_rotation_num').value=x_rotation">
    </div>
    <div class="control btn-row">
        <button onclick="adjustX(-0.1)">◀</button>
        <button onclick="adjustX(-0.01)">◁</button>
        <button onclick="adjustX(0.01)">▷</button>
        <button onclick="adjustX(0.1)">▶</button>
    </div>
    <div class="control btn-row" style="font-size:14px">
        <button onclick="x_rotation=0; updateDisplay()">0</button>
        <button onclick="x_rotation=1/3; updateDisplay()">⅓</button>
        <button onclick="x_rotation=1/5; updateDisplay()">⅕</button>
        <button onclick="x_rotation=1/6; updateDisplay()">⅙</button>
        <button onclick="x_rotation=1/7; updateDisplay()">⅐</button>
        <button onclick="x_rotation=1/9; updateDisplay()">⅑</button>
    </div>
    <div class="control btn-row">
        <span class="label">rotateY</span>
        <input type="text" id="y_rotation_num" value="0"
            style="width:100px;font-size:20px;padding:4px" onchange="y_rotation=safeEval(this.value); updateDisplay()">
    </div>
    <div class="control">
        <input type="range" id="y_rotation_slide" value=0 min="0" max="1" step=0.000001
            style="width:400px" oninput="y_rotation=parseFloat(this.value);document.getElementById('y_rotation_num').value=y_rotation">
    </div>
    <div class="control btn-row">
        <button onclick="adjustY(-0.1)">◀</button>
        <button onclick="adjustY(-0.01)">◁</button>
        <button onclick="adjustY(0.01)">▷</button>
        <button onclick="adjustY(0.1)">▶</button>
    </div>
    <div class="control btn-row" style="font-size:14px">
        <button onclick="y_rotation=0; updateDisplay()">0</button>
        <button onclick="y_rotation=1/3; updateDisplay()">⅓</button>
        <button onclick="y_rotation=1/5; updateDisplay()">⅕</button>
        <button onclick="y_rotation=1/6; updateDisplay()">⅙</button>
        <button onclick="y_rotation=1/7; updateDisplay()">⅐</button>
        <button onclick="y_rotation=1/9; updateDisplay()">⅑</button>
    </div>
    <div class="control btn-row">
        <span class="label">rotateZ</span>
        <input type="text" id="z_rotation_num" value="0"
               style="width:100px;font-size:20px;padding:4px"
	       onchange="z_rotation=safeEval(this.value); updateDisplay()">
    </div>
    <div class="control">
        <input type="range" id="z_rotation_slide" value=0 min="0" max="1" step=0.000001
               style="width:400px"
	       oninput="z_rotation=parseFloat(this.value);document.getElementById('z_rotation_num').value=z_rotation">
    </div>
    <div class="control btn-row">
        <button onclick="adjustZ(-0.1)">◀</button>
        <button onclick="adjustZ(-0.01)">◁</button>
        <button onclick="adjustZ(0.01)">▷</button>
        <button onclick="adjustZ(0.1)">▶</button>
    </div>
    <div class="control btn-row" style="font-size:14px">
        <button onclick="z_rotation=0; updateDisplay()">0</button>
        <button onclick="z_rotation=1/3; updateDisplay()">⅓</button>
        <button onclick="z_rotation=1/5; updateDisplay()">⅕</button>
        <button onclick="z_rotation=1/6; updateDisplay()">⅙</button>
        <button onclick="z_rotation=1/7; updateDisplay()">⅐</button>
        <button onclick="z_rotation=1/9; updateDisplay()">⅑</button>
    </div>
    <div class="control">
        <span class="label">offset</span>
        <input type="range" id="offset" value=0.1 min=-2.0 max=2.0 step=0.01
            oninput="offset = parseFloat(value);">
    </div>
</div>

<div id="panel-right">
    <div class="control">
        <span class="label">loops</span>
        <input type="range" id="loops" value=10 min=1 max=200 step=1
            oninput="loops = parseFloat(value);">
    </div>
    <div class="control">
        <span class="label">line width</span>
        <input type="range" id="lineWidth" value=3 min=1 max=20 step=1
            oninput="lineWidth = parseInt(value);">
    </div>
    <div class="control">
        <span class="label">scale</span>
        <input type="range" id="scale" value=200 min=10 max=400 step=1 oninput="scale = parseFloat(value);">
    </div>
    <div class="control">
        <span class="label">animate</span>
        <input type="range" id="speedOff" value=0 min=0 max=0.05 step=0.001
            oninput="speedOff = parseFloat(value);">
    </div>
</div>

<div id="panel-bottom">
    <button onclick="pause()">pause</button>
    <button onclick="randomize()">randomize</button>
    <label>
        <input type="checkbox" id="inColor" onclick="colorMgr.flip();">
        color
    </label>
    <label>
        <input type="checkbox" id="lightMode" onclick="toggleLight();">
        light
    </label>
    <input type="color" id="colorPicker" value="#00ffff" oninput="customColor = this.value;">
    <span class="credit">by <a href="https://github.com/marksilverman/spheromaniac">Mark Silverman</a></span>
</div>
</div>

<script src="gl-matrix-min.js"></script>
<script src="sphereo.js"></script>

</body>
</html>
